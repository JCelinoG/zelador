spring:
  application:
    name: zelador

  datasource:
    url: jdbc:postgresql://localhost:5432/zelador
    username: zelador
    password: zelador
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: zelador

logging:
  level:
    br.com.zelador: DEBUG
    org.flywaydb: INFO