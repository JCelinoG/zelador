services:
  postgres:
    image: postgres:16-alpine
    container_name: zelador-postgres
    environment:
      POSTGRES_DB: zelador
      POSTGRES_USER: zelador
      POSTGRES_PASSWORD: zelador
    ports:
      - "5432:5432"
    volumes:
      - zelador_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zelador -d zelador"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zelador-redis
    ports:
      - "6379:6379"
    volumes:
      - zelador_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: zelador-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - zelador_prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    container_name: zelador-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - zelador_grafana:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  zelador_pg:
  zelador_redis:
  zelador_prometheus:
  zelador_grafana: